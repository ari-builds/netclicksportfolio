<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function () {
      sessionStorage.redirect = location.pathname + location.search + location.hash;
      var root = location.pathname.replace(/\/[^/]*$/, "/");
      location.replace(root);
    })();
  </script>
</head>
<body></body>
</html>
